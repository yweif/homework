services:
  - type: web
    name: homework-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://yweif.github.io
      - key: NODE_ENV
        value: production
